<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#fff"/>

  <!-- Snowman body -->
  <circle cx="128" cy="195" r="45" fill="#fff" stroke="#000" stroke-width="5"/>
  <circle cx="128" cy="135" r="35" fill="#fff" stroke="#000" stroke-width="5"/>
  <circle cx="128" cy="85" r="25" fill="#fff" stroke="#000" stroke-width="5"/>

  <!-- Hat -->
  <rect x="98" y="50" width="60" height="12" fill="#000"/>
  <rect x="108" y="25" width="40" height="25" fill="#000"/>

  <!-- Eyes -->
  <circle cx="118" cy="80" r="3" fill="#000"/>
  <circle cx="138" cy="80" r="3" fill="#000"/>

  <!-- Nose -->
  <polygon points="128,86 140,92 128,98" fill="#000"/>

  <!-- Buttons -->
  <circle cx="128" cy="125" r="4" fill="#000"/>
  <circle cx="128" cy="145" r="4" fill="#000"/>
  <circle cx="128" cy="165" r="4" fill="#000"/>

  <!-- Left arm -->
  <line x1="93" y1="130" x2="55" y2="110" stroke="#000" stroke-width="5" stroke-linecap="round"/>

  <!-- Right arm holding rifle -->
  <line x1="163" y1="130" x2="150" y2="160" stroke="#000" stroke-width="5" stroke-linecap="round"/>

  <!-- Automatic rifle -->
  <g>
    <rect x="120" y="145" width="20" height="10" fill="#000"/>
    <rect x="140" y="142" width="40" height="16" fill="#000"/>
    <rect x="180" y="146" width="40" height="6" fill="#000"/>
    <rect x="155" y="144" width="25" height="12" fill="#000"/>
    <rect x="150" y="158" width="10" height="20" fill="#000" transform="rotate(10 155 158)"/>
    <rect x="140" y="158" width="8" height="16" fill="#000" transform="rotate(-15 144 158)"/>
    <rect x="210" y="140" width="4" height="8" fill="#000"/>
    <rect x="170" y="136" width="6" height="6" fill="#000"/>
  </g>
</svg>