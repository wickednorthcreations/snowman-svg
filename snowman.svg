<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Snowman body - three circles -->
  <circle cx="100" cy="240" r="45" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="135" r="35" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="100" cy="50" r="28" fill="white" stroke="black" stroke-width="1"/>
  
  <!-- Top hat -->
  <rect x="75" y="15" width="50" height="12" fill="black"/>
  <rect x="72" y="27" width="56" height="8" fill="black"/>
  
  <!-- Carrot nose -->
  <polygon points="100,55 100,65 115,60" fill="#FF8C00"/>
  
  <!-- Buttons -->
  <circle cx="100" cy="120" r="2" fill="black"/>
  <circle cx="100" cy="135" r="2" fill="black"/>
  <circle cx="100" cy="150" r="2" fill="black"/>
  
  <!-- Left stick arm -->
  <line x1="65" y1="130" x2="30" y2="110" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="110" x2="15" y2="100" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="110" x2="20" y2="125" stroke="black" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Right stick arm (holding machine gun) -->
  <line x1="135" y1="130" x2="170" y2="115" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="115" x2="185" y2="108" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="170" y1="115" x2="180" y2="130" stroke="black" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Small machine gun in right hand -->
  <rect x="168" y="108" width="28" height="6" fill="black" stroke="black" stroke-width="0.5" rx="1"/>
  <rect x="190" y="105" width="4" height="12" fill="black"/>
  <rect x="175" y="103" width="3" height="4" fill="black"/>
  <circle cx="172" cy="111" r="2" fill="black"/>
  <line x1="195" y1="110" x2="200" y2="108" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
</svg>